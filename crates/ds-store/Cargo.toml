[package]
name = "ds-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Content-addressed store for downloaded artifacts"

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

# Minecraft manifests declare sha1; Modrinth declares sha1 and sha512. Both are
# needed to verify what we download against what was promised.
sha1 = "0.11"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
